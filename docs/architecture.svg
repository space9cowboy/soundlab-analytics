  <!-- séparateur -->
  <line x1="40" y1="756" x2="1300" y2="756" stroke="#C9D4DA"/>
  <text x="40" y="775" font-family="sans-serif" font-size="10" fill="#5A6B78">Découplage volontaire : chaque étage lit et écrit dans S3. EMR n'écrit jamais dans Redshift — Spark dépose du Parquet, Redshift le charge par COPY. Aucun lien réseau entre les deux.</text>
