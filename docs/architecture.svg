  <text x="245" y="491" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">SQL ad hoc directement sur S3</text>
  <text x="245" y="510" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">aucune infrastructure</text>
  <text x="245" y="533" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5A6B78">exploration · contrôles qualité</text>

  <!-- Redshift -->
  <rect x="400" y="446" width="250" height="104" rx="4" fill="#DCEEEF" stroke="#0B6E75" stroke-width="1.6"/>
  <text x="525" y="470" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">Redshift Serverless · 8 RPU</text>
  <text x="525" y="491" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">schéma en étoile · COPY 9,7 M en 3,1 s</text>
  <text x="525" y="510" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#14202A">dim_track — DISTSTYLE ALL</text>
  <text x="525" y="527" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#14202A">fact_listening — DISTKEY(track_id)</text>
  <text x="525" y="543" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#0B6E75">accès par Data API · aucun port ouvert</text>

  <!-- ML local -->
  <rect x="700" y="446" width="230" height="104" rx="4" fill="#DCEEEF" stroke="#0B6E75" stroke-width="1.6"/>
  <text x="815" y="470" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">Entraînement — poste local</text>
  <text x="815" y="491" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">scikit-learn · MLflow · SHAP</text>
  <text x="815" y="510" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">30 459 lignes — Spark non justifié</text>
  <text x="815" y="533" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0B6E75">AUC 0,7875 ± 0,0059</text>

  <line x1="934" y1="498" x2="972" y2="498" stroke="#14202A" stroke-width="1.4" marker-end="url(#fleche)"/>

