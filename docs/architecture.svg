  <rect x="538" y="100" width="238" height="235" rx="4" fill="#F7FAFA" stroke="#0B6E75" stroke-width="1.6"/>
  <text x="657" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">EMR Serverless</text>
  <text x="657" y="139" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5A6B78">PySpark 3.5 · ARM64 · 14 vCPU</text>

  <rect x="554" y="150" width="206" height="52" rx="3" fill="#DCEEEF" stroke="#0B6E75"/>
