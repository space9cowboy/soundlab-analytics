<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 790" width="1340" height="790" role="img" aria-label="Architecture Big Data de SoundLab Analytics : les CSV Kaggle sont déposés dans S3 raw chiffré, traités par trois jobs PySpark sur EMR Serverless, écrits en Parquet dans S3 curated et déclarés au catalogue Glue. La couche curated alimente Athena pour l'analyse ad hoc, Redshift Serverless en schéma en étoile, et l'entraînement local du modèle. Le modèle est publié dans S3 puis servi par API Gateway et Lambda. Sécurité et observabilité sont transverses.">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14202A"/>
    </marker>
    <marker id="fleche-futur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0521C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="790" fill="#FFFFFF"/>

  <!-- ══════════ ORCHESTRATION (réalisée) ══════════ -->
  <rect x="40" y="20" width="1260" height="46" rx="4" fill="#DCEEEF" stroke="#0B6E75" stroke-width="1.4"/>
  <text x="60" y="40" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#0B6E75">ORCHESTRATION — AIRFLOW 2.10 EN CONTENEUR LOCAL</text>
  <text x="60" y="56" font-family="sans-serif" font-size="11" fill="#5A6B78">DAG en losange : T7 ∥ T8 → porte de qualité T9 → T10 → chargement Redshift · 5 tâches en 8 min 11 s · pool à 1 emplacement (quota de 16 vCPU) · MWAA écarté (≈ 350 €/mois à vide)</text>

  <!-- ══════════ BANDE 1 — INGESTION ET PRÉPARATION ══════════ -->
  <text x="40" y="95" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B6E75" letter-spacing="1.2">1 · INGESTION ET PRÉPARATION DISTRIBUÉE</text>

  <!-- Source -->
  <rect x="40" y="108" width="170" height="96" rx="4" fill="#EEF1F3" stroke="#C9D4DA"/>
  <text x="125" y="132" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">Kaggle</text>
  <text x="125" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">Million Song Dataset</text>
  <text x="125" y="169" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">+ Taste Profile</text>
  <text x="125" y="189" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5A6B78">2 CSV · 617 Mo</text>

  <line x1="214" y1="156" x2="272" y2="156" stroke="#14202A" stroke-width="1.4" marker-end="url(#fleche)"/>
  <text x="243" y="146" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">flux</text>
  <text x="243" y="172" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">SHA-256</text>

  <!-- S3 raw -->
  <rect x="278" y="108" width="192" height="96" rx="4" fill="#DCEEEF" stroke="#0B6E75" stroke-width="1.6"/>
  <text x="374" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">S3 · raw</text>
  <text x="374" y="149" text-anchor="middle" font-family="monospace" font-size="10" fill="#5A6B78">music_info.csv</text>
  <text x="374" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#5A6B78">user_listening_history.csv</text>
  <text x="374" y="187" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0B6E75">chiffré CMK KMS · immuable</text>

  <line x1="474" y1="200" x2="532" y2="200" stroke="#14202A" stroke-width="1.4" marker-end="url(#fleche)"/>
  <text x="503" y="192" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">lit</text>

