  <text x="951" y="224" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">9 711 301 × 4 · 317 Mio</text>

  <rect x="858" y="238" width="186" height="36" rx="3" fill="#FFFFFF" stroke="#C9D4DA"/>
  <text x="951" y="253" text-anchor="middle" font-family="monospace" font-size="10" fill="#14202A">track_engagement</text>
  <text x="951" y="267" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">30 459 · agrégat précalculé</text>

  <rect x="858" y="281" width="186" height="36" rx="3" fill="#FFFFFF" stroke="#C9D4DA"/>
