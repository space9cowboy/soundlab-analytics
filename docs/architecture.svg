  <rect x="844" y="100" width="214" height="235" rx="4" fill="#DCEEEF" stroke="#0B6E75" stroke-width="1.6"/>
  <text x="951" y="122" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">S3 · curated</text>
  <text x="951" y="139" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5A6B78">Parquet + Snappy · chiffré KMS</text>

  <rect x="858" y="152" width="186" height="36" rx="3" fill="#FFFFFF" stroke="#C9D4DA"/>
