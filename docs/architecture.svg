  <line x1="815" y1="398" x2="815" y2="442" stroke="#14202A" stroke-width="1.4" marker-end="url(#fleche)"/>

  <!-- Athena -->
  <rect x="140" y="446" width="210" height="104" rx="4" fill="#EEF1F3" stroke="#C9D4DA"/>
