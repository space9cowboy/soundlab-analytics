  <text x="951" y="310" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">30 459 × 32 · jeu d'entraînement</text>

  <line x1="1062" y1="200" x2="1118" y2="200" stroke="#14202A" stroke-width="1.4" marker-end="url(#fleche)"/>
  <text x="1090" y="192" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5A6B78">déclare</text>

  <!-- Glue -->
  <rect x="1124" y="140" width="176" height="120" rx="4" fill="#EEF1F3" stroke="#C9D4DA"/>
  <text x="1212" y="164" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#14202A">Catalogue Glue</text>
  <text x="1212" y="184" text-anchor="middle" font-family="monospace" font-size="10" fill="#5A6B78">soundlab_curated</text>
