  <rect x="554" y="210" width="206" height="52" rx="3" fill="#DCEEEF" stroke="#0B6E75"/>
  <text x="657" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#14202A">T8 · Pseudonymisation</text>
  <text x="657" y="246" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5A6B78">9,7 M lignes · SHA-256 salé · 38 s</text>

  <rect x="554" y="270" width="206" height="52" rx="3" fill="#DCEEEF" stroke="#0B6E75"/>
  <text x="657" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#14202A">T10 · Feature engineering</text>
