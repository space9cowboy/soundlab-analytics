# SoundLab Analytics - Airflow local (LocalExecutor)
# Aucun acces AWS a ce stade : voir 00_init_airflow.sh

x-airflow-commun: &airflow-commun
  image: apache/airflow:2.10.5-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '15'
    # Identifiants temporaires issus de SoundLabAirflowRole.
    # Alimentes par le fichier .env, renouveles par 02_jetons.sh.
    # Aucune cle permanente ne franchit cette frontiere.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    AWS_REGION: ${AWS_REGION:-eu-north-1}
    AWS_DEFAULT_REGION: ${AWS_REGION:-eu-north-1}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Initialisation de la base de metadonnees et creation du compte.
  # Ce service s'execute une fois puis se termine ; les deux suivants
  # attendent sa terminaison reussie.
  airflow-init:
    <<: *airflow-commun
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --role Admin --username admin --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Loic --lastname Rabetsanta \
          --email loic@soundlab.local 2>/dev/null || true
        echo "Initialisation terminee."
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-commun
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-commun
    command: webserver
    # Liaison sur la boucle locale uniquement : l'interface n'est pas
    # exposee aux autres machines du reseau.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-airflow:
